<style>
:root{
  --primary:#0F7B5F;
  --primary-2:#18A97E;
  --primary-3:#DDF7EE;
  --gold:#D4A24C;
  --gold-2:#F2D59A;
  --ai:#1E3A8A;
  --violet:#7C3AED;
  --bg:#F8FAF8;
  --surface:#FFFFFF;
  --surface-2:#F1F5F3;
  --surface-3:#EAF1EE;
  --text:#0F172A;
  --muted:#667085;
  --line:#E6EAE8;
  --focus:#7DD3FC;
  --success:#16A34A;
  --warning:#D97706;
  --danger:#DC2626;
  --shadow-xs:0 3px 12px rgba(15,23,42,.05);
  --shadow-sm:0 10px 32px rgba(15,23,42,.08);
  --shadow-lg:0 30px 90px rgba(15,23,42,.14);
  --radius-xl:32px;
  --radius-lg:24px;
  --radius-md:18px;
  --radius-sm:13px;
  --container:1240px;
  --font-ar:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-en:"Manrope",system-ui,sans-serif;
}

html[data-theme="dark"]{
  --bg:#08111A;
  --surface:#0E1823;
  --surface-2:#14212D;
  --surface-3:#1A2937;
  --text:#F8FAFC;
  --muted:#98A6B5;
  --line:#22313F;
  --primary-3:#10382E;
  --shadow-xs:0 3px 14px rgba(0,0,0,.18);
  --shadow-sm:0 12px 36px rgba(0,0,0,.24);
  --shadow-lg:0 30px 100px rgba(0,0,0,.36);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth;}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-ar);
  line-height:1.6;
}

body.locked{overflow:hidden;}

button,input,select,textarea{font:inherit;}

button{cursor:pointer;}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
}

a{color:inherit;text-decoration:none;}

img{max-width:100%;display:block;}

::selection{background:rgba(15,123,95,.18);}

.skip-link{
  position:absolute;
  left:-9999px;
  top:8px;
  z-index:200;
  padding:10px 16px;
  background:#0F7B5F;
  color:#fff;
  border-radius:12px;
  font-weight:800;
  text-decoration:none;
}
.skip-link:focus{left:16px;}

.container{max-width:var(--container);margin:0 auto;padding:0 20px;}

.row{display:flex;align-items:center;gap:10px;}

.muted{color:var(--muted);}

.success{color:var(--success);font-weight:800;}

.notice{
  padding:13px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:14px;
  font-size:13px;
  line-height:1.7;
}

.price-note{font-size:11px;color:var(--muted);line-height:1.6;}

.code-note{
  font-family:ui-monospace,monospace;
  background:#0F172A;
  color:#F1F5F9;
  padding:10px 12px;
  border-radius:10px;
  font-size:12px;
  direction:ltr;
  text-align:left;
  overflow:auto;
}

.list{display:grid;gap:12px;}

/* TOPBAR */
.topbar{
  position:sticky;
  top:0;
  z-index:90;
  background:rgba(248,250,248,.86);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(230,234,232,.82);
}

html[data-theme="dark"] .topbar{
  background:rgba(8,17,26,.86);
  border-bottom-color:rgba(34,49,63,.82);
}

.nav{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}

.brand{display:flex;align-items:center;gap:11px;min-width:220px;}

.brand-mark{
  width:44px;
  height:44px;
  border-radius:15px;
  background:linear-gradient(145deg,#0A5A45,#16A77C 58%,#D4A24C);
  display:grid;
  place-items:center;
  box-shadow:0 8px 24px rgba(15,123,95,.25);
  flex:none;
}

.brand-mark svg{width:28px;height:28px;}

.brand-name{font-weight:800;}

.brand-sub{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:600;
  margin-top:-2px;
}

.nav-links{display:flex;align-items:center;gap:6px;}

.nav-link{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:10px 12px;
  border-radius:12px;
  font-weight:700;
}

.nav-link:hover,
.nav-link.active{color:var(--primary);background:var(--primary-3);}

.nav-actions{display:flex;gap:8px;align-items:center;}

.icon-btn,
.btn,
.seg-btn{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--text);
  border-radius:14px;
}

.icon-btn{width:42px;height:42px;display:grid;place-items:center;}

.btn{
  padding:11px 16px;
  font-weight:800;
  transition:.18s transform,.18s box-shadow,.18s background;
}

.btn:hover{transform:translateY(-1px);}

.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;
  border-color:transparent;
  box-shadow:0 12px 24px rgba(15,123,95,.24);
}

.btn-gold{
  background:linear-gradient(135deg,var(--gold),#E7BF72);
  color:#1B221E;
  border-color:transparent;
}

.btn-ai{
  background:linear-gradient(135deg,var(--ai),var(--violet));
  color:#fff;
  border-color:transparent;
  box-shadow:0 12px 28px rgba(76,54,196,.20);
}

.btn-ghost{background:transparent;}

.btn-block{width:100%;}

.mobile-menu{display:none;}

/* HERO */
.hero-wrap{padding:28px 0 10px;}

.hero{
  position:relative;
  overflow:hidden;
  border-radius:var(--radius-xl);
  padding:52px 46px;
  background:
    radial-gradient(circle at 88% 12%,rgba(124,58,237,.35),transparent 23%),
    radial-gradient(circle at 12% 92%,rgba(212,162,76,.24),transparent 22%),
    linear-gradient(135deg,#072D29 0%,#0F7B5F 47%,#102943 100%);
  color:#fff;
  box-shadow:var(--shadow-lg);
}

.hero::before{
  content:"";
  position:absolute;
  inset:auto -120px -160px auto;
  width:420px;
  height:420px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:
    0 0 0 65px rgba(255,255,255,.035),
    0 0 0 130px rgba(255,255,255,.02);
}

.hero-grid{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1.12fr .88fr;
  gap:34px;
  align-items:center;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.09);
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}

.eyebrow-dot{
  width:8px;
  height:8px;
  background:#6EE7B7;
  border-radius:50%;
  box-shadow:0 0 0 5px rgba(110,231,183,.12);
}

.hero h1{
  font-size:clamp(34px,5.2vw,64px);
  line-height:1.08;
  letter-spacing:-.9px;
  margin:16px 0 14px;
}

.hero p{
  font-size:17px;
  color:rgba(255,255,255,.84);
  max-width:670px;
  margin:0;
}

.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}

.hero-search{
  margin-top:18px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  background:#fff;
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  box-shadow:0 16px 30px rgba(0,0,0,.12);
  max-width:760px;
}

.hero-search input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  padding:13px 12px;
  background:transparent;
  color:#0F172A;
}

.hero-search button{border:0;}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:22px;
}

.hero-stat{
  padding:12px 14px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  border-radius:15px;
}

.hero-stat strong{display:block;font-size:20px;}

.hero-stat span{display:block;font-size:12px;color:rgba(255,255,255,.72);}

/* MASCOT */
.mascot-stage{
  min-height:440px;
  display:grid;
  place-items:center;
  position:relative;
  perspective:900px;
}

.orb{
  position:absolute;
  width:320px;
  height:320px;
  border-radius:50%;
  background:radial-gradient(circle,#3E8BFF30 0,#7C3AED2E 36%,transparent 70%);
  filter:blur(4px);
  animation:orbPulse 3s ease-in-out infinite;
}

@keyframes orbPulse{
  0%,100%{transform:scale(1);opacity:.9}
  50%{transform:scale(1.08);opacity:1}
}

.mascot{
  position:relative;
  width:200px;
  height:200px;
  border-radius:50%;
  background:radial-gradient(circle at 36% 28%,#D6FFB8 0 7%,#9DE36F 11%,#63C94E 53%,#3D9838 92%);
  box-shadow:
    inset -18px -28px 0 rgba(29,92,36,.11),
    0 30px 70px rgba(0,0,0,.24);
  animation:float 3.6s ease-in-out infinite;
  transform-style:preserve-3d;
}

.mascot::before,
.mascot::after{
  content:"";
  position:absolute;
  top:-16px;
  width:22px;
  height:28px;
  border-radius:80% 45% 55% 20%;
  background:linear-gradient(#E6C87A,#B07C23);
  box-shadow:inset 0 -7px 0 rgba(0,0,0,.08);
}

.mascot::before{left:26px;transform:rotate(-16deg);}

.mascot::after{right:26px;transform:rotate(16deg);}

.mascot-eye{
  position:absolute;
  width:86px;
  height:86px;
  border-radius:50%;
  background:#fff;
  border:7px solid #245F2D;
  left:57px;
  top:44px;
  display:grid;
  place-items:center;
  box-shadow:0 10px 22px rgba(0,0,0,.12);
  transition:.4s;
  transform-origin:center;
}

.mascot-pupil{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#1D2732;
  box-shadow:8px -7px 0 -4px #fff;
  transition:.2s;
  position:relative;
}

.mascot-mouth{
  position:absolute;
  left:62px;
  bottom:33px;
  width:76px;
  height:26px;
  border-bottom:8px solid #2A512A;
  border-radius:0 0 55px 55px;
  transition:.3s;
}

.mascot-mouth.talking{animation:talk .28s ease-in-out infinite alternate;}

@keyframes talk{from{height:20px}to{height:34px}}

.mascot-hood{
  position:absolute;
  left:28px;
  right:28px;
  bottom:-1px;
  height:46px;
  border-radius:25px 25px 20px 20px;
  background:linear-gradient(180deg,#8C55EC,#6625B8);
}

.mascot-hood::after{
  content:"M";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:900;
  font-size:22px;
}

.mascot-hand{
  position:absolute;
  width:36px;
  height:36px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#A7E87D,#5FB544 70%);
  border:3px solid #3A8A36;
  box-shadow:0 6px 12px rgba(0,0,0,.2);
  transition:.5s cubic-bezier(.4,1.6,.5,1);
  opacity:.95;
}

.mascot-hand.left{
  left:-26px;
  top:60%;
  transform:translateY(-50%) rotate(-25deg);
}

.mascot-hand.right{
  right:-26px;
  top:60%;
  transform:translateY(-50%) rotate(25deg);
}

.mascot-hand.wave{animation:wave .5s ease-in-out 4;}

.mascot-hand.emoji-throw{animation:throwEmoji .9s ease-out forwards;}

@keyframes wave{
  0%,100%{transform:translateY(-50%) rotate(25deg)}
  50%{transform:translateY(-70%) rotate(70deg)}
}

@keyframes throwEmoji{
  0%{transform:translateY(-50%) scale(1)}
  50%{transform:translateY(-110%) scale(1.3) rotate(45deg)}
  100%{transform:translateY(-50%) scale(1)}
}

.flying-emoji{
  position:absolute;
  font-size:38px;
  pointer-events:none;
  animation:flyEmoji 1.6s ease-out forwards;
  z-index:5;
}

@keyframes flyEmoji{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  20%{opacity:1;transform:translate(10px,-30px) scale(1.1)}
  100%{opacity:0;transform:translate(60px,-140px) scale(.6)}
}

.cameo-stage{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(80px) scale(.6);
  opacity:0;
  transition:.7s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
  z-index:6;
  text-align:center;
}

.cameo-stage.show{
  opacity:1;
  transform:translateX(-50%) translateY(0) scale(1);
  pointer-events:auto;
}

.cameo-figure{
  width:70px;
  height:70px;
  border-radius:50%;
  background:linear-gradient(145deg,#F5D78E,#C9A64E);
  display:grid;
  place-items:center;
  box-shadow:0 12px 26px rgba(0,0,0,.35);
  border:3px solid #fff;
  margin:0 auto;
}

.cameo-figure::after{content:"🎙️";font-size:34px;}

.cameo-caption{
  margin-top:6px;
  padding:6px 12px;
  background:#fff;
  color:#111827;
  border-radius:999px;
  font-weight:800;
  font-size:11px;
  white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
}

.lamp{
  position:absolute;
  right:8px;
  bottom:40px;
  font-size:52px;
  filter:drop-shadow(0 0 16px rgba(212,162,76,.86));
  animation:lampGlow 1.9s ease-in-out infinite;
}

.ai-bubble{
  position:absolute;
  left:-10px;
  top:30px;
  max-width:250px;
  padding:13px 15px;
  background:#fff;
  color:#111827;
  border-radius:19px 19px 19px 8px;
  box-shadow:0 18px 40px rgba(0,0,0,.16);
  font-weight:800;
  font-size:13px;
}

.ai-bubble small{
  display:block;
  color:#64748B;
  margin-top:4px;
  font-weight:600;
}

@keyframes float{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-12px) rotate(-1deg)}
}

@keyframes lampGlow{
  0%,100%{transform:translateY(0) rotate(-6deg);filter:drop-shadow(0 0 9px rgba(212,162,76,.55))}
  50%{transform:translateY(-5px) rotate(6deg);filter:drop-shadow(0 0 18px rgba(212,162,76,.95))}
}

/* SECTIONS */
.section{padding:22px 0;}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:14px;
}

.section-title{display:flex;align-items:center;gap:9px;}

.section-title .mark{
  width:10px;
  height:10px;
  border-radius:3px;
  background:linear-gradient(135deg,var(--gold),var(--violet));
}

.section h2{font-size:28px;line-height:1.2;margin:0;}

.section-sub{margin-top:5px;color:var(--muted);font-size:13px;}

.grid{display:grid;gap:16px;}

.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));}

.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));}

.grid-4{grid-template-columns:repeat(4,minmax(0,1fr));}

.grid-5{grid-template-columns:repeat(5,minmax(0,1fr));}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-xs);
}

.card.pad{padding:18px;}

.card.hover{transition:.2s transform,.2s box-shadow,.2s border;}

.card.hover:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow-sm);
  border-color:rgba(15,123,95,.35);
}

.service{
  padding:17px;
  min-height:166px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden;
  text-align:right;
  width:100%;
  cursor:pointer;
}

.service-icon{
  width:54px;
  height:54px;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:25px;
  background:linear-gradient(135deg,var(--primary-3),rgba(124,58,237,.09));
  color:var(--primary);
}

.service h3{margin:11px 0 3px;font-size:18px;}

.service p{color:var(--muted);font-size:13px;}

.service .scope{
  margin-top:12px;
  display:inline-flex;
  width:max-content;
  padding:5px 9px;
  border-radius:999px;
  background:var(--surface-2);
  font-size:11px;
  color:var(--muted);
}

.trust{padding:20px;display:flex;align-items:center;gap:14px;}

.trust-icon{
  width:52px;
  height:52px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:var(--surface-2);
  font-size:22px;
}

.trust strong{display:block;}

.trust p{color:var(--muted);font-size:13px;margin-top:2px;}

.searchbar{
  display:flex;
  gap:8px;
  padding:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:17px;
  box-shadow:var(--shadow-xs);
  align-items:center;
}

.searchbar input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:12px;
}

.chip-row{display:flex;gap:8px;overflow:auto;padding:2px;}

.chip{
  padding:8px 11px;
  border-radius:999px;
  font-size:12px;
  white-space:nowrap;
  background:var(--surface);
  border:1px solid var(--line);
  cursor:pointer;
  color:var(--text);
}

.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.person,
.product,
.vehicle{
  padding:14px;
  display:flex;
  gap:13px;
  align-items:flex-start;
  text-align:right;
  width:100%;
  cursor:pointer;
}

.avatar{
  width:62px;
  height:62px;
  border-radius:18px;
  object-fit:cover;
  border:1px solid var(--line);
  background:var(--surface-2);
  flex:none;
}

.meta{color:var(--muted);font-size:12px;}

.rating{color:#E2A500;font-weight:800;}

.price{color:var(--primary);font-size:18px;font-weight:900;}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(22,163,74,.10);
  color:#15803D;
  font-size:11px;
  font-weight:800;
}

.badge.gold{background:rgba(212,162,76,.12);color:#8A651E;}

.badge.ai{background:rgba(124,58,237,.11);color:#6D28D9;}

.page-title{
  display:flex;
  align-items:start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:16px;
}

.page-title h1{font-size:32px;margin:0;}

.page-title p{color:var(--muted);margin-top:5px;}

.back{color:var(--primary);font-weight:800;}

.profile-hero{
  padding:22px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:18px;
  align-items:start;
  background:linear-gradient(145deg,var(--surface),var(--surface-2));
}

.profile-main{display:flex;gap:16px;align-items:center;}

.profile-avatar{
  width:94px;
  height:94px;
  border-radius:27px;
  object-fit:cover;
  border:3px solid var(--surface);
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  flex:none;
}

.profile-name{font-size:26px;font-weight:900;}

.profile-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

.profile-side{
  padding:15px;
  border-radius:19px;
  background:var(--surface);
  border:1px solid var(--line);
}

.info-list{display:grid;gap:0;}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px 0;
  border-bottom:1px dashed var(--line);
  font-size:14px;
  align-items:center;
}

.info-row:last-child{border-bottom:0;}

.info-label{color:var(--muted);}

.map-card{
  min-height:270px;
  border-radius:22px;
  background:linear-gradient(155deg,#eef8f4,#eaf1ff);
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
}

.map-card::before,
.map-card::after{
  content:"";
  position:absolute;
  inset:-20% -10%;
  background:
    linear-gradient(25deg,transparent 47%,rgba(15,123,95,.19) 47.5%,rgba(15,123,95,.19) 48%,transparent 48.5%) 0 0/130px 130px,
    linear-gradient(-20deg,transparent 48%,rgba(30,58,138,.11) 48.5%,rgba(30,58,138,.11) 49%,transparent 49.5%) 0 0/150px 150px;
}

.map-pin{
  position:absolute;
  font-size:34px;
  filter:drop-shadow(0 7px 6px rgba(0,0,0,.17));
  z-index:1;
}

.map-label{
  position:absolute;
  z-index:2;
  padding:7px 10px;
  border-radius:11px;
  background:#fff;
  box-shadow:var(--shadow-xs);
  font-size:11px;
  font-weight:800;
  color:#0F172A;
}

.map-label.a{left:13%;top:22%}
.map-label.b{right:14%;bottom:17%}
.map-pin.a{left:19%;top:30%}
.map-pin.b{right:18%;bottom:23%}

.timeline{display:flex;gap:7px;overflow:auto;padding:4px;}

.step{min-width:102px;text-align:center;background:transparent;border:0;color:var(--text);}

.step-dot{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--surface-2);
  margin:0 auto 5px;
}

.step.active .step-dot{background:var(--primary);color:#fff;}

.step span{font-size:11px;color:var(--muted);}

.booking-grid{display:grid;grid-template-columns:1fr .84fr;gap:18px;}

.field{display:flex;flex-direction:column;gap:7px;}

.field label{font-size:12px;color:var(--muted);font-weight:800;}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:12px 13px;
  background:var(--surface);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  outline:0;
}

.field textarea{min-height:110px;resize:vertical;}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}

.full{grid-column:1/-1;}

.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}

.slot{
  padding:10px;
  text-align:center;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:11px;
  font-weight:800;
  color:var(--text);
}

.slot.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.ai-panel{
  background:linear-gradient(145deg,#F3F7FF,#F8F6FF);
  border:1px solid #D9E2F2;
  color:#0F172A;
}

.ai-head{display:flex;align-items:center;gap:12px;}

.ai-mascot-sm{
  width:58px;
  height:58px;
  border-radius:20px;
  position:relative;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 38% 28%,#CFF5B5,#7ED957 55%,#4BA43C);
  box-shadow:0 10px 25px rgba(66,173,70,.25);
  flex:none;
}

.ai-mascot-sm::before,
.ai-mascot-sm::after{
  content:"";
  position:absolute;
  top:-4px;
  width:9px;
  height:11px;
  border-radius:8px;
  background:#D4A24C;
}

.ai-mascot-sm::before{left:11px;transform:rotate(-20deg);}

.ai-mascot-sm::after{right:11px;transform:rotate(20deg);}

.ai-eye{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#fff;
  border:3px solid #255E2E;
  display:grid;
  place-items:center;
}

.ai-eye::after{
  content:"";
  width:9px;
  height:9px;
  background:#1E293B;
  border-radius:50%;
}

.ai-mini-bubble{
  margin-top:12px;
  padding:11px 13px;
  border-radius:15px;
  background:#fff;
  border:1px solid #E1E8F3;
  box-shadow:var(--shadow-xs);
  font-size:13px;
  font-weight:800;
}

.ai-actions{display:flex;gap:7px;overflow:auto;margin-top:10px;}

.chat{
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:300px;
  max-height:54vh;
  overflow:auto;
  padding:4px;
}

.bubble{
  max-width:84%;
  padding:12px 14px;
  border-radius:17px;
  line-height:1.75;
  font-size:13px;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.bubble.ai{
  align-self:flex-start;
  background:#EFF6FF;
  border:1px solid #D9E7FF;
  color:#0F172A;
}

.bubble.user{
  align-self:flex-end;
  background:var(--primary);
  color:#fff;
}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;}

.table{width:100%;border-collapse:collapse;min-width:620px;}

.table th,
.table td{
  padding:12px 13px;
  border-bottom:1px solid var(--line);
  text-align:right;
  font-size:13px;
}

.table th{background:var(--surface-2);font-weight:900;}

.table tr:last-child td{border-bottom:0;}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

.kpi{padding:18px;}

.kpi small{color:var(--muted);}

.kpi strong{display:block;font-size:27px;margin-top:3px;}

.trend{font-size:12px;color:var(--success);margin-top:5px;}

.bar-chart{
  height:250px;
  display:flex;
  align-items:end;
  gap:10px;
  padding:22px 8px 8px;
}

.bar{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  justify-content:end;
}

.bar i{
  display:block;
  width:100%;
  max-width:42px;
  border-radius:10px 10px 4px 4px;
  background:linear-gradient(180deg,var(--violet),var(--primary));
}

.bar span{font-size:11px;color:var(--muted);}

.plan{padding:20px;position:relative;overflow:hidden;}

.plan.recommended{border:2px solid rgba(15,123,95,.48);}

.plan-badge{position:absolute;top:13px;left:13px;}

.plan h3{margin:0;}

.plan-price{font-size:27px;font-weight:900;color:var(--primary);margin-top:8px;}

.plan-year{font-size:11px;color:var(--muted);}

.plan-list{display:grid;gap:7px;margin-top:13px;font-size:12px;}

.plan-list div{display:flex;gap:7px;}

.plan-list b{color:var(--primary);}

.invoice{overflow:hidden;position:relative;}

.invoice::before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:6px;
  background:linear-gradient(90deg,var(--primary),var(--gold),var(--violet));
}

.invoice-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
}

.invoice-number{color:var(--muted);font-size:12px;margin-top:4px;}

.invoice-total{font-size:34px;font-weight:900;color:var(--primary);}

.empty{padding:48px 20px;text-align:center;}

.empty-icon{font-size:50px;}

.empty h3{margin:10px 0 5px;}

.footer{
  margin-top:36px;
  padding:46px 0 120px;
  background:linear-gradient(180deg,var(--bg),var(--surface-2));
  border-top:1px solid var(--line);
}

.footer-grid{
  display:grid;
  grid-template-columns:1.2fr repeat(3,1fr);
  gap:24px;
}

.footer h4{margin:0 0 10px;}

.footer p,
.footer a{font-size:13px;color:var(--muted);}

.footer-links{display:grid;gap:7px;}

.copyright{
  margin-top:28px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.bottom-nav{
  position:fixed;
  z-index:80;
  bottom:0;
  left:0;
  right:0;
  display:none;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

html[data-theme="dark"] .bottom-nav{background:rgba(14,24,35,.94);}

.bottom-nav-inner{
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:7px 8px;
}

.bottom-nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 3px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
}

.bottom-nav button.active{color:var(--primary);}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(4,12,20,.62);
  z-index:120;
  display:none;
  padding:15px;
  align-items:flex-end;
  justify-content:center;
}

.modal-backdrop.show{display:flex;}

.modal{
  width:min(840px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:28px 28px 16px 16px;
  box-shadow:var(--shadow-lg);
}

.modal-head{
  padding:15px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  background:var(--surface);
  z-index:1;
}

.modal-body{padding:18px;}

.toast{
  position:fixed;
  z-index:130;
  right:50%;
  transform:translateX(50%) translateY(10px);
  bottom:100px;
  background:#101828;
  color:#fff;
  border-radius:13px;
  padding:11px 14px;
  opacity:0;
  pointer-events:none;
  transition:.22s;
  box-shadow:var(--shadow-sm);
  font-size:13px;
  max-width:90vw;
  text-align:center;
}

.toast.show{opacity:1;transform:translateX(50%) translateY(0);}

.install-banner{
  display:none;
  position:fixed;
  z-index:105;
  left:16px;
  right:16px;
  bottom:88px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow-lg);
  padding:12px 14px;
  gap:10px;
  align-items:center;
}

.install-banner.show{display:flex;}

.install-icon{
  width:46px;
  height:46px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:var(--primary-3);
  flex:none;
}

.mini-label{font-size:11px;color:var(--muted);}

.role-card{
  padding:22px;
  text-align:center;
  cursor:pointer;
  border:2px solid var(--line);
  transition:.2s;
  background:var(--surface);
  color:var(--text);
}

.role-card:hover{border-color:var(--primary);transform:translateY(-3px);}

.role-card .role-icon{font-size:44px;margin-bottom:8px;}

/* AI FAB */
.ai-fab{
  position:fixed;
  right:18px;
  bottom:104px;
  z-index:100;
  width:76px;
  height:76px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#B6EE85,#63C94E 55%,#3D9838);
  box-shadow:
    0 14px 32px rgba(66,173,70,.38),
    0 0 0 6px rgba(255,255,255,.6);
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:.25s;
  animation:fabFloat 3s ease-in-out infinite;
}

.ai-fab:hover{transform:scale(1.08);}

.ai-fab .ai-fab-eye{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:50%;
  background:#fff;
  border:3px solid #245F2D;
  display:grid;
  place-items:center;
  top:16px;
}

.ai-fab .ai-fab-eye::after{
  content:"";
  width:11px;
  height:11px;
  background:#1D2732;
  border-radius:50%;
  animation:lookAround 3s ease-in-out infinite;
}

.ai-fab .ai-fab-label{
  position:absolute;
  bottom:6px;
  font-size:9px;
  font-weight:900;
  color:#1B4A1E;
  letter-spacing:.5px;
}

.ai-fab .lamp{
  position:absolute;
  top:-6px;
  right:-6px;
  font-size:22px;
  filter:drop-shadow(0 0 8px rgba(212,162,76,.9));
}

@keyframes fabFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

@keyframes lookAround{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(3px,-2px)}
  50%{transform:translate(-3px,-2px)}
  75%{transform:translate(2px,2px)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.001ms!important;
  }
}

@media (max-width:1050px){
  .nav-links{display:none;}
  .mobile-menu{display:grid;}
  .hero-grid{grid-template-columns:1fr;}
  .mascot-stage{min-height:360px;}
  .grid-5{grid-template-columns:repeat(3,minmax(0,1fr));}
  .footer-grid{grid-template-columns:1.2fr repeat(2,1fr);}
}

@media (max-width:800px){
  .container{padding:0 14px;}
  .nav{height:68px;}
  .brand{min-width:auto;}
  .nav-actions .desktop-only{display:none;}
  .hero{padding:32px 22px;border-radius:26px;}
  .grid-4,.grid-3,.grid-5{grid-template-columns:repeat(2,minmax(0,1fr));}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .profile-hero,.booking-grid{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr 1fr;}
  .bottom-nav{display:block;}
  .app{padding-bottom:74px;}
  .ai-fab{bottom:88px;width:66px;height:66px;}
}

@media (max-width:560px){
  .hero h1{font-size:36px;}
  .hero-actions{display:grid;grid-template-columns:1fr;}
  .hero-actions .btn{width:100%;}
  .grid-2,.grid-3,.grid-4,.grid-5,.kpis,.form-grid{grid-template-columns:1fr;}
  .slots{grid-template-columns:repeat(2,1fr);}
  .footer-grid{grid-template-columns:1fr;}
  .mascot{width:170px;height:170px;}
  .mascot-eye{width:72px;height:72px;left:49px;top:38px;}
}

<script>
'use strict';

/* =========================================================
   خدمات بلدي | Mazen AI
   SINGLE FILE EDITION — v5.2 (Hardened + PWA)
   =========================================================
   ملاحظات الإنتاج:
   - الواجهة Client-side.
   - أي صلاحيات Owner حقيقية يجب فرضها من Backend.
   - أي مفاتيح API يجب ألا توضع داخل المتصفح.
   - الدفع الحقيقي يحتاج Payment Intent + Webhook.
   - البيانات الحالية Demo وليست Database.
   - Service Worker يحتاج ملف sw.js منفصل بجانب الصفحة.
   ========================================================= */

const CONFIG = {
  version:'5.2-hardened-pwa',
  region:'الشرقية / فاقوس',
  productionAIEndpoint:'',
  currency:'ج.م'
};

/* ---------- GLOBAL STATE ---------- */

let selected = null;
let selectedSlot = null;
let draft = null;
let lastOrder = null;
let currentRoute = 'home';
let deferredInstall = null;
let currentModalRideKind = '';
let currentDeliveryKind = '';

/* ---------- SAFE HELPERS ---------- */

const safeJSON = (value,fallback)=>{
  try{
    const v = JSON.parse(value);
    return v ?? fallback;
  }catch{
    return fallback;
  }
};

const getLocal = (key,fallback)=>{
  try{
    const x = localStorage.getItem(key);
    return x===null ? fallback : x;
  }catch{
    return fallback;
  }
};

const setLocal = (key,value)=>{
  try{
    localStorage.setItem(key,value);
  }catch{}
};

const removeLocal = key=>{
  try{
    localStorage.removeItem(key);
  }catch{}
};

const esc = value =>
  String(value ?? '')
    .replace(/[&<>"']/g,m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m]));

const money = (n,c=CONFIG.currency)=>{
  const number = Number(n)||0;
  return new Intl.NumberFormat('ar-EG').format(Math.round(number))+' '+c;
};

const localDate = ()=>{
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${year}-${month}-${day}`;
};

const localDateLabel = ()=>{
  try{
    return new Date().toLocaleString('ar-EG',{
      dateStyle:'medium',
      timeStyle:'short'
    });
  }catch{

/* ---------- UI HELPERS ---------- */

function toast(message){
  const element = document.getElementById('toast');
  if(!element)return;
  element.textContent = String(message || '');
  element.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(
    ()=>element.classList.remove('show'),
    2800
  );
}

function showModal(title, body){
  const backdrop = document.getElementById('modalBackdrop');
  const titleEl  = document.getElementById('modalTitle');
  const bodyEl   = document.getElementById('modalBody');
  if(!backdrop || !titleEl || !bodyEl) return;

  titleEl.textContent = String(title || 'Mazen AI');
  bodyEl.innerHTML    = String(body || '');

  backdrop.setAttribute('aria-hidden','false');
  backdrop.classList.add('show');
  document.body.classList.add('locked');

  // a11y: move focus inside
  const focusable = backdrop.querySelector(
    'input, select, textarea, button:not([data-action="close-modal"])'
  );
  focusable?.focus();
}

function closeModal(){
  const backdrop = document.getElementById('modalBackdrop');
  if(!backdrop)return;
  backdrop.classList.remove('show');
  backdrop.setAttribute('aria-hidden','true');
  document.body.classList.remove('locked');
}

function modalBackdropClick(event){
  if(event.target === event.currentTarget) closeModal();
}

function setTheme(theme){
  APP.theme = theme==='dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = APP.theme;
  save();
}

function toggleTheme(){
  setTheme(APP.theme==='dark' ? 'light' : 'dark');
}

function setActiveNav(route){
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.classList.toggle('active', el.dataset.route===route);
  });
}

/* ---------- ROUTER ---------- */

const ROUTES = [
  'home','explore','orders','messages','profile','ai',
  'doctors','doctor','teachers','teacher','delivery',
  'mobile','mobileProduct','cars','car','invoice',
  'provider','owner','subscriptions'
];

function parseHash(){
  const raw = location.hash.replace(/^#/,'').trim();
  if(!raw) return { route:'home', id:null };
  const parts = raw.split('/');
  return {
    route: parts[0] || 'home',
    id: parts[1] ? decodeURIComponent(parts[1]) : null
  };
}

function resolveData(route,id){
  if(!id) return null;
  switch(route){
    case 'doctor': return findDoctor(id);
    case 'teacher': return findTeacher(id);
    case 'mobileProduct': return findMobile(id);
    case 'car': return findCar(id);
    case 'invoice': return findOrder(id);
    default: return null;
  }
}

function navigate(route, data=null, opts={push:true}){

  // FIX: force-clean UI state on every navigation
  document.body.classList.remove('locked');
  const backdrop = document.getElementById('modalBackdrop');
  if(backdrop && backdrop.classList.contains('show')){
    backdrop.classList.remove('show');
    backdrop.setAttribute('aria-hidden','true');
  }

  currentRoute = ROUTES.includes(route) ? route : 'home';
  selected     = data && data.id ? data : null;

  if(opts.push){
    const id = selected?.id;
    const hash = id
      ? `#${currentRoute}/${encodeURIComponent(id)}`
      : `#${currentRoute}`;
    if(location.hash!==hash){
      history.pushState(
        {route:currentRoute, id:id||null},
        '',
        hash
      );
    }
  }

  setActiveNav(currentRoute);
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}

window.addEventListener('popstate', ()=>{

  // FIX: cleanup state
  document.body.classList.remove('locked');
  const backdrop = document.getElementById('modalBackdrop');
  if(backdrop && backdrop.classList.contains('show')){
    backdrop.classList.remove('show');
    backdrop.setAttribute('aria-hidden','true');
  }

  const state = parseHash();
  currentRoute = ROUTES.includes(state.route) ? state.route : 'home';
  selected = resolveData(currentRoute, state.id);

  // FIX: keep active nav in sync
  setActiveNav(currentRoute);

  render();
});

function submitCheckout(){
  const confirm = val('cConfirm');
  const phone = val('cPhone').replace(/\D/g,'');

  if(!/^01\d{9}$/.test(phone)){
    toast('رقم الموبايل يجب أن يكون 11 رقمًا مصريًا');
    return;
  }

  if(confirm==='review'){
    closeModal();
    openAIWithText(
      'أحتاج مراجعة الطلب قبل الدفع: '+
      (draft?.mode || '')+' '+(draft?.item?.name || '')
    );
    return;
  }

  APP.user.name = val('cName');
  APP.user.phone = phone;
  save();

  const total = Number(val('checkoutTotal')) || 0;
  const currency = val('checkoutCurrency') || 'ج.م';
  const fee = Number(val('checkoutFee')) || 0;
  const payment = val('cPay');

  closeModal();

  createOrder(
    (draft?.mode ? draft.mode+' — ' : '') + (draft?.item?.name || 'طلب خدمة'),
    { customer:APP.user, payment, baseTotal:total-fee },

/* ---------- REAL AI ADAPTER ---------- */

async function requestProductionAI(text){
  if(!CONFIG.productionAIEndpoint) return null;

  try{
    const response = await fetch(CONFIG.productionAIEndpoint, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({
        message:text,
        locale:'ar-EG',
        context:{ role:APP.role, region:CONFIG.region }
      })
    });

    if(!response.ok) return null;
    const data = await response.json();
    return data.reply || data.message || null;
  }catch{
    return null;
  }
}

/* ---------- LOCAL AI FALLBACK ---------- */

async function aiReply(text){
  const production = await requestProductionAI(text);
  if(production) return production;

  const t = String(text).toLowerCase();

  if(/دكتور|طبيب|عيادة|أسنان|باطنة|عظام|دكتورة/.test(t)){
    const spec = /أسنان/.test(t) ? 'أسنان' : /باطنة/.test(t) ? 'باطنة' : /عظام/.test(t) ? 'عظام' : null;
    return `تمام يا باشا 👌\n\n${spec ? 'تخصص '+spec+' — ' : ''}\n\nقولي المكان واليوم والساعة، وأنا أطلعلك أقرب الأطباء المتاحين مع الرقم والعنوان والكشف.`;
  }

  if(/مدرس|tutor|درس|تعليم|شرح|ثانوي|إعدادي|ابتدائي/.test(t)){
    const stage = /ثانوي/.test(t) ? 'الثانوي' : /إعدادي/.test(t) ? 'الإعدادي' : /ابتدائي/.test(t) ? 'الابتدائي' : null;
    return `حاضر يا فندم 📚\n\n${stage ? 'مرحلة '+stage+' — ' : ''}\n\nقولي المادة والمكان (منزل/سنتر/أونلاين) والمدة، وأنا أظبطلك أفضل مدرس بالسعر والتقييم.`;
  }

  if(/مطار|توصيل|توصيلة|دليفري/.test(t)){
    const kind = /مطار/.test(t) ? 'للمطار' : 'داخل المدينة';
    return `حاضر 🚗\n\n${kind} —\n\nقولي منين لفين، ونوع المركبة (توك توك / ملاكي / فان / ميكروباص) والموعد، وأنا أحسبلك السعر وأأكد الطلب.`;
  }

  if(/موبايل|آيفون|ايفون|سامسونج|جوال|هاتف/.test(t)){
    return `حلو جدًا 📱\n\nقولي الموديل والميزانية، وأنا أقارن السعر والحالة والتقييم والضمان قبل ما تشتري.`;
  }

  if(/عربية|سيارة|سيارات|عربيات|سياره/.test(t)){
    return `تمام 🚘\n\nسوق السيارات مفتوح للجميع.\n\nأقدر أساعدك في الشراء أو البيع أو الإيجار — قولي نوع العملية والموديل والميزانية.`;
  }

  if(/محامي|محامى|قانون|استشارة قانونية/.test(t)){
    return `تمام ⚖️\n\nأقدر أساعدك تحدد نوع الخدمة القانونية وتوصل للمسار المناسب.\n\nابعتلي نوع المشكلة، المحافظة، وهل تحتاج استشارة أو إجراء كامل.`;
  }

  if(/صيدلية|دواء|صيدليه/.test(t)){
    return `حاضر 💊\n\nقولي اسم المنتج أو نوعه، والمنطقة، وأنا أجهز لك مسار البحث عن أقرب صيدلية.`;
  }

  if(/طلب|order|حجز/.test(t)){
    return `تم يا باشا 🚀\n\nهنمشي بالترتيب:\n\n1) تحديد الخدمة\n2) جمع المعلومات الناقصة فقط\n3) مقارنة الخيارات\n4) مراجعة السعر\n5) التأكيد والمتابعة والفاتورة`;
  }

  if(/شكرا|تمام|تسلم|شكراً/.test(t)){
    return `العفو يا باشا 🌟\nدايمًا في خدمتك.`;
  }

  return `فهمتك يا باشا ✨\n\nهحوّل كلامك لمسار واضح:\n\n1) تحديد نوع الخدمة\n2) جمع المعلومات الناقصة فقط\n3) مقارنة الخيارات والسعر\n4) ملخص ومراجعة\n5) تأكيد ومتابعة\n\nقولي الخدمة اللي محتاجها.`;
}

/* ---------- VOICE ---------- */

let cachedVoices = [];

function loadVoices(){
  try{
    cachedVoices = window.speechSynthesis?.getVoices() || [];
  }catch{}
}

if(typeof window.speechSynthesis!=='undefined'){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  try{
    if(!APP.voiceEnabled) return;
    if(typeof window.speechSynthesis==='undefined') return;

    const clean = String(text)
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'')
      .trim();

    if(!clean)return;

    const utterance = new SpeechSynthesisUtterance(clean);
    utterance.lang = 'ar-EG';
    utterance.rate = 1.02;
    utterance.pitch = 1.06;
    utterance.volume = 1;

    if(!cachedVoices.length) loadVoices();

    const egyptian = cachedVoices.find(v => /ar[-_]EG/i.test(v.lang) || /egypt/i.test(v.name));
    const arabic = cachedVoices.find(v => /^ar/i.test(v.lang));
    utterance.voice = egyptian || arabic || null;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);

    const mouth = document.getElementById('mascotMouth');
    if(mouth){
      mouth.classList.add('talking');
      clearTimeout(window.__mouthTimer);
      window.__mouthTimer = setTimeout(
        ()=>mouth.classList.remove('talking'),
        Math.max(1200, clean.length*65)
      );
    }
  }catch{}
}

function voiceInput(id){
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Recognition){ toast('الإملاء الصوتي غير مدعوم في هذا المتصفح'); return; }

  const recognition = new Recognition();
  recognition.lang = 'ar-EG';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = event=>{
    const el = document.getElementById(id);
    if(el){ el.value = event.results[0][0].transcript; }
    toast('تم التقاط الكلام ✅');
  };
  recognition.onerror = ()=>{ toast('تعذر تشغيل الميكروفون'); };

  try{ recognition.start(); }
  catch{ toast('الميكروفون مستخدم بالفعل'); }
}

function throwEmoji(){
  const stage = document.getElementById('mascotStage');
  const hand = document.getElementById('mascotHandL');
  if(!stage || !hand)return;
  if(Date.now()-APP.lastEmojiAt < 1500) return;

  APP.lastEmojiAt = Date.now();
  hand.classList.add('emoji-throw');
  setTimeout(()=>hand.classList.remove('emoji-throw'), 900);

  const emojis = ['🚀','✨','🎉','💚','⭐','🔥','👍','🌟'];
  const emoji = document.createElement('div');
  emoji.className = 'flying-emoji';
  emoji.textContent = emojis[Math.floor(Math.random()*emojis.length)];

  const hr = hand.getBoundingClientRect();
  const sr = stage.getBoundingClientRect();
  emoji.style.left = (hr.left-sr.left+10)+'px';
  emoji.style.top = (hr.top-sr.top-10)+'px';

  stage.appendChild(emoji);
  setTimeout(()=>emoji.remove(), 1700);
}

}

function downloadInvoice(no, total, currency){
  const txt = `خدمات بلدي | Mazen AI
الفاتورة: ${no}
العميل: ${APP.user.name}
الهاتف: ${APP.user.phone}
التاريخ: ${localDateLabel()}
الإجمالي: ${money(total,currency)}`;
  downloadBlob(txt, no+'.txt', 'text/plain;charset=utf-8');
  toast('تم حفظ الفاتورة');
}

async function shareInvoiceById(id){
  const o = findOrder(id) || lastOrder;
  if(!o){ toast('لا توجد فاتورة'); return; }
  const number = 'INV-'+o.id.replace(/^ORD-/,'');
  await shareInvoice(number);
}

async function shareInvoice(no){
  try{
    if(navigator.share){
      await navigator.share({
        title:'فاتورة '+no,
        text:'فاتورة خدمات بلدي | Mazen AI — '+no
      });
      return;
    }
    toast('رقم الفاتورة: '+no);
  }catch{}
}

/* ---------- SEARCH ---------- */

function bindExploreSearch(){
  const input = document.getElementById('exploreSearch');
  const grid = document.getElementById('exploreGrid');
  if(!input || !grid)return;

  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    grid.querySelectorAll('[data-searchable]').forEach(card=>{
      const text = card.dataset.searchable.toLowerCase();
      card.style.display = !q || text.includes(q) ? '' : 'none';
    });
  });

  document.querySelectorAll('#exploreChips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('#exploreChips .chip').forEach(x=>x.classList.remove('active'));
      chip.classList.add('active');

      const filter = chip.dataset.filter;
      if(filter==='الكل'){
        grid.querySelectorAll('[data-searchable]').forEach(c=>c.style.display='');
        return;
      }

      const mapping = {
        صحة:['الأطباء','الصيدليات'],
        تعليم:['المدرسين'],
        توصيل:['وصلني'],
        تجارة:['المتاجر','الموبايلات'],
        سيارات:['السيارات','صيانة'],
        رقمي:['الخدمات الرقمية']
      };

      const keys = mapping[filter] || [];
      grid.querySelectorAll('[data-searchable]').forEach(card=>{
        const text = card.dataset.searchable;
        const matches = keys.some(key=>text.includes(key));
        card.style.display = matches ? '' : 'none';
      });
    });
  });
}

function bindGenericSearch(inputId, gridId){
  const input = document.getElementById(inputId);
  const grid = document.getElementById(gridId);
  if(!input || !grid)return;

  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    grid.querySelectorAll('button').forEach(card=>{
      const text = card.textContent.toLowerCase();
      card.style.display = !q || text.includes(q) ? '' : 'none';
    });
  });
}

/* ---------- EXPORT ---------- */

function exportOrders(type){
  const data = APP.orders;

  if(type==='json'){
    downloadBlob(
      JSON.stringify(data, null, 2),
      'mazen-orders.json',
      'application/json'
    );
    return;
  }

  const header = 'id,title,total,currency,platformFee,status,createdAt\n';
  const rows = data.map(o=>
    [o.id,o.title,o.total,o.currency,o.platformFee||0,o.status,o.createdAt]
      .map(v=>`"${String(v).replace(/"/g,'""')}"`)
      .join(',')
  ).join('\n');

  downloadBlob('\ufeff'+header+rows, 'mazen-orders.csv', 'text/csv;charset=utf-8');
}

function downloadBlob(content, name, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- EVENT DELEGATION ---------- */

document.addEventListener('click', event=>{
  const el = event.target.closest('[data-action],[data-filter]');
  if(!el)return;
  if(el.hasAttribute('data-filter')) return;

  const action = el.dataset.action;

  switch(action){
    case 'route': navigate(el.dataset.route); break;
    case 'ai': openAI(); break;
    case 'theme': toggleTheme(); break;
    case 'notifications': openNotifications(); break;
    case 'mobile-menu': openMobileMenu(); break;
    case 'close-modal': closeModal(); break;
    case 'install': installApp(); break;
    case 'hide-install': hideInstallBanner(); break;
    case 'ask': askFrom(el.dataset.input); break;
    case 'voice': voiceInput(el.dataset.input); break;
    case 'service': openService(el.dataset.id); break;

    case 'doctor': {
      const d = findDoctor(el.dataset.id);
      if(d) navigate('doctor', d);
      break;
    }
    case 'doctor-book': {
      const d = findDoctor(el.dataset.id);
      if(d){ selected = d; draft = { type:'doctor', item:d }; showBooking('doctor', d); }
      break;
    }
    case 'teacher': {
      const t = findTeacher(el.dataset.id);
      if(t) navigate('teacher', t);
      break;
    }
    case 'teacher-book': {
      const t = findTeacher(el.dataset.id);
      if(t){ selected = t; draft = { type:'teacher', item:t }; showBooking('teacher', t); }
      break;
    }

    case 'delivery-type':
      closeModal();
      openDeliveryType(el.dataset.type);
      break;

    case 'ride-form':
      currentModalRideKind = el.dataset.kind || '';
      closeModal();
      openRideForm(el.dataset.kind);
      break;

    case 'delivery-form':
      closeModal();
      openDeliveryForm(el.dataset.kind);
      break;

    case 'mobile-product': {
      const m = findMobile(el.dataset.id);
      if(m) navigate('mobileProduct', m);
      break;
    }

    case 'buy-product': buyProduct(el.dataset.id); break;

    case 'car': {
      const c = findCar(el.dataset.id);
      if(c) navigate('car', c);
      break;
    }

    case 'car-buy': carAction('شراء'); break;
    case 'car-rent': carAction('إيجار'); break;
    case 'car-listing': openCarListing(); break;

    case 'quick-ai': quickAI(el.dataset.text); break;
    case 'send-ai': sendAI(); break;
    case 'send-message': sendMessage(); break;
    case 'rawi': playRawiMoment(); break;
    case 'speak-line': speak(el.dataset.text || ''); break;

    case 'provider-category': chooseProviderCategory(el.dataset.id); break;
    case 'provider-plans': openProviderPlans(); break;

    case 'subscribe':
      subscribePlan(
        el.dataset.name,
        Number(el.dataset.monthly),
        Number(el.dataset.yearly)
      );
      break;

    case 'owner': openOwnerGate(); break;
    case 'owner-2fa': owner2FA(); break;

    case 'payout':
      toast('مسار السحب يحتاج Payout Provider + Reconciliation + Audit Log');
      break;

    case 'export': exportOrders(el.dataset.export); break;
    case 'delete': requestDelete(); break;
    case 'confirm-delete': confirmDelete(); break;

    case 'invoice': {
      const order = findOrder(el.dataset.id);
      if(order) navigate('invoice', order);
      break;
    }

    case 'download-invoice': downloadInvoiceById(el.dataset.id); break;
    case 'share-invoice': shareInvoiceById(el.dataset.id); break;
    case 'reorder': reorder(el.dataset.id); break;
    case 'bye': closeInvoiceAndSayBye(); break;
    case 'policy': showPolicy(el.dataset.type); break;

    case 'toast':
      toast(el.dataset.text || 'تم');
      break;

    case 'pick-role': pickRole(el.dataset.role); break;

    default: break;
  }
});

/* ---------- SUBMIT DELEGATION ---------- */

document.addEventListener('submit', async event=>{

  if(form.id==='bookingForm'){ event.preventDefault(); submitBooking(); return; }
  if(form.id==='checkoutForm'){ event.preventDefault(); submitCheckout(); return; }
  if(form.id==='rideForm'){ event.preventDefault(); submitRide(); return; }
  if(form.id==='deliveryForm'){ event.preventDefault(); submitDelivery(); return; }

  if(form.id==='profileForm'){
    event.preventDefault();
    APP.user.name = val('pfName').trim();
    APP.user.phone = val('pfPhone').replace(/\D/g,'');
    if(!/^01\d{9}$/.test(APP.user.phone)){
      toast('رقم الموبايل يجب أن يكون 11 رقمًا مصريًا');
      return;
    }
    save();
    toast('تم حفظ البيانات');
    return;

  if(form.id==='providerForm'){
    event.preventDefault();
    toast('تم حفظ المسودة محليًا — الربط الحقيقي يحتاج API آمن');
    return;

  if(form.id==='carListingForm'){
    event.preventDefault();
    closeModal();
    toast('تم تجهيز إعلان السيارة — التخزين الحقيقي للصور يكون في Object Storage.');

  }

  if(form.id==='ownerVerifyForm'){ event.preventDefault(); verifyOwner(); return; }
  if(form.id==='owner2faForm'){ event.preventDefault(); verifyOwner2FA(); return; }

  if(form.id==='owner2faForm2'){
    event.preventDefault();
    toast('واجهة 2FA جاهزة للربط بمزود الهوية');
    closeModal();
    return;
  }
});

/* ---------- KEYBOARD ---------- */

document.addEventListener('keydown', event=>{
  if(event.key==='Escape') closeModal();

  if(
    event.key==='/' &&
    !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)
  ){
    event.preventDefault();
    openAI();
  }

  if(event.key==='Enter' && document.activeElement?.id==='aiInput' && !event.shiftKey){
    event.preventDefault();
    sendAI();
  }

  if(event.key==='Enter' && document.activeElement?.id==='messageInput' && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }

  if(
    (event.key==='Enter' || event.key===' ') &&
    document.activeElement?.id==='aiFab'
  ){
    event.preventDefault();
    openAI();
  }
});

window.addEventListener('beforeinstallprompt', event=>{

    banner.hidden = false;
    banner.classList.add('show');
  }
});

window.addEventListener('appinstalled', ()=>{
  deferredInstall = null;
  hideInstallBanner();
  toast('تم تثبيت خدمات بلدي كتطبيق 🎉');
});

async function installApp(){
  if(deferredInstall){
    const installEvent = deferredInstall;
    deferredInstall = null;
    try{
      await installEvent.prompt();
      const choice = await installEvent.userChoice;
      hideInstallBanner();
      toast(
        choice?.outcome==='accepted'
          ? 'تمت الموافقة على التثبيت ✅'
          : 'تم إلغاء التثبيت'
      );
    }catch{
      hideInstallBanner();
      toast('تعذر فتح نافذة التثبيت');
    }
    return;
  }

  toast('من المتصفح اختر «إضافة إلى الشاشة الرئيسية» إذا لم يظهر زر التثبيت');
}

function hideInstallBanner(){
  const banner = document.getElementById('installBanner');
  if(!banner)return;
  banner.hidden = true;
  banner.classList.remove('show');
}

(function injectManifest(){
  fetch('./manifest.webmanifest', { method: 'HEAD' })
    .then(r => { if(!r.ok) throw 0; })
    .catch(() => {
      const manifest = {
        name: 'خدمات بلدي | Mazen AI',
        short_name: 'خدمات بلدي',
        start_url: './index.html#home',
        scope: './',
        display: 'standalone',
        dir: 'rtl',
        lang: 'ar',
        background_color: '#F8FAF8',
        theme_color: '#0F7B5F',
        icons: [{
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230F7B5F'/%3E%3Cpath d='M120 382V178l136-78 136 78v204' fill='none' stroke='%23fff' stroke-width='30'/%3E%3Cpath d='M190 382V230h132v152' fill='none' stroke='%23D4A24C' stroke-width='30'/%3E%3C/svg%3E",
          sizes: '512x512',
          type: 'image/svg+xml',
          purpose: 'any maskable'
        }]
      };
      const url = URL.createObjectURL(new Blob(
        [JSON.stringify(manifest)],
        { type: 'application/manifest+json' }
      ));
      const link = document.createElement('link');
      link.rel  = 'manifest';
      link.href = url;
      document.head.appendChild(link);
    });
})();

/* =========================================================
   SERVICE WORKER REGISTRATION (needs sw.js beside this file)
   ========================================================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', async () => {
    try{
      const registration = await navigator.serviceWorker.register(
        './sw.js',
        { scope: './' }
      );
      console.info('[PWA] SW registered:', registration.scope);

      registration.addEventListener('updatefound', () => {
        const worker = registration.installing;
        if(!worker) return;
        worker.addEventListener('statechange', () => {
          if(
            worker.state === 'installed' &&
            navigator.serviceWorker.controller
          ){
            toast('تم تحميل نسخة جديدة — أعد التحميل للتحديث ✨');
          }
        });
      });
    }catch(err){
      console.warn('[PWA] SW registration failed:', err?.message || err);
      if(
        !sessionStorage.getItem('mb_sw_hint_shown') &&
        !navigator.serviceWorker.controller
      ){
        sessionStorage.setItem('mb_sw_hint_shown','1');
        setTimeout(() => {
          toast('لتشغيل PWA: احفظ ملف sw.js بجانب index.html');
        }, 4000);
      }
    }
  });
}
