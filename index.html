<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0F7B5F">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="خدمات بلدي | Mazen AI — منصة رقمية ذكية لاكتشاف الخدمات المحلية وطلبها ومتابعتها.">
  <meta name="robots" content="index,follow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="خدمات بلدي">
  <meta property="og:title" content="خدمات بلدي | Mazen AI">
  <meta property="og:description" content="ابحث عن الخدمة المناسبة، قارن الخيارات، وأدر طلبك من مكان واحد.">
  <meta property="og:type" content="website">
  <title>خدمات بلدي | Mazen AI</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#0F7B5F;
      --primary-2:#18A97E;
      --primary-3:#DDF7EE;
      --gold:#D4A24C;
      --gold-2:#F4DEA9;
      --ai:#1E3A8A;
      --violet:#7C3AED;
      --bg:#F7FAF8;
      --surface:#FFFFFF;
      --surface-2:#F1F5F3;
      --surface-3:#E9F1EE;
      --text:#101828;
      --muted:#667085;
      --line:#E3E9E6;
      --focus:#60A5FA;
      --success:#16A34A;
      --warning:#D97706;
      --danger:#DC2626;
      --shadow-xs:0 3px 12px rgba(15,23,42,.05);
      --shadow-sm:0 12px 36px rgba(15,23,42,.08);
      --shadow-lg:0 36px 110px rgba(15,23,42,.16);
      --radius-xl:32px;
      --radius-lg:24px;
      --radius-md:18px;
      --radius-sm:13px;
      --container:1240px;
      --font-ar:"IBM Plex Sans Arabic",system-ui,sans-serif;
      --font-en:"Manrope",system-ui,sans-serif;
    }

    html[data-theme="dark"]{
      --bg:#071019;
      --surface:#0D1822;
      --surface-2:#13202C;
      --surface-3:#182935;
      --text:#F8FAFC;
      --muted:#9BA9B7;
      --line:#233442;
      --primary-3:#0F332A;
      --shadow-xs:0 3px 14px rgba(0,0,0,.20);
      --shadow-sm:0 16px 44px rgba(0,0,0,.26);
      --shadow-lg:0 40px 120px rgba(0,0,0,.40);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:var(--font-ar);
      line-height:1.6
    }
    body.locked{overflow:hidden}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible{
      outline:3px solid var(--focus);
      outline-offset:2px
    }
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%}
    ::selection{background:rgba(15,123,95,.18)}
    .container{max-width:var(--container);margin:0 auto;padding:0 20px}
    .skip-link{
      position:absolute;
      left:-9999px;
      top:8px;
      z-index:300;
      padding:10px 16px;
      background:var(--primary);
      color:#fff;
      border-radius:12px;
      font-weight:800
    }
    .skip-link:focus{left:16px}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .success{color:var(--success);font-weight:800}
    .warning{color:var(--warning);font-weight:800}
    .danger{color:var(--danger);font-weight:800}
    .row{display:flex;align-items:center;gap:10px}
    .wrap{flex-wrap:wrap}
    .grow{flex:1}
    .center{text-align:center}
    .ltr{direction:ltr;text-align:left}
    .page{min-height:100vh}

    /* Topbar */
    .topbar{
      position:sticky;
      top:0;
      z-index:80;
      background:color-mix(in srgb,var(--surface) 88%,transparent);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line)
    }
    .nav{
      height:76px;
      display:flex;
      align-items:center;
      gap:20px
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:250px
    }
    .brand-mark{
      width:46px;
      height:46px;
      border-radius:15px;
      background:linear-gradient(145deg,var(--primary),#0A604A);
      display:grid;
      place-items:center;
      box-shadow:0 10px 25px rgba(15,123,95,.22)
    }
    .brand-mark svg{width:30px;height:30px}
    .brand-name{display:block;font-size:16px;line-height:1.1}
    .brand-sub{
      display:block;
      font-size:10px;
      color:var(--muted);
      margin-top:3px;
      font-family:var(--font-en)
    }
    .nav-links{
      display:flex;
      align-items:center;
      gap:6px;
      flex:1
    }
    .nav-link{
      border:0;
      background:transparent;
      color:var(--muted);
      padding:10px 13px;
      border-radius:12px;
      font-weight:800
    }
    .nav-link:hover,
    .nav-link.active{
      background:var(--surface-2);
      color:var(--text)
    }
    .nav-actions{
      display:flex;
      align-items:center;
      gap:8px
    }
    .icon-btn{
      width:42px;
      height:42px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:13px;
      display:grid;
      place-items:center
    }
    .icon-btn:hover{
      transform:translateY(-1px);
      box-shadow:var(--shadow-xs)
    }
    .avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      background:linear-gradient(145deg,#9BE7C9,#54B99B);
      display:grid;
      place-items:center;
      color:#0A4F3E;
      font-weight:900
    }

    /* Buttons */
    .btn{
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:14px;
      padding:12px 16px;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:.2s ease;
      box-shadow:var(--shadow-xs)
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none
    }
    .btn-primary{
      border-color:var(--primary);
      background:var(--primary);
      color:#fff;
      box-shadow:0 10px 24px rgba(15,123,95,.20)
    }
    .btn-ai{
      border-color:var(--ai);
      background:linear-gradient(135deg,#1E3A8A,#5537B5);
      color:#fff;
      box-shadow:0 12px 28px rgba(30,58,138,.20)
    }
    .btn-ghost{background:transparent;box-shadow:none}
    .btn-block{width:100%}
    .btn-danger{
      border-color:#F3B5B5;
      color:var(--danger);
      background:#FFF6F6
    }
    html[data-theme="dark"] .btn-danger{
      background:#241315;
      border-color:#4B2428
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--surface-2);
      font-size:11px;
      font-weight:900;
      white-space:nowrap
    }
    .badge.primary{background:var(--primary-3);color:var(--primary)}
    .badge.ai{background:#EEF2FF;color:var(--ai)}
    .badge.gold{background:#FBF2DC;color:#8A6124}
    .badge.success{background:#E9F9EE;color:#15803D}
    html[data-theme="dark"] .badge.ai{
      background:#18284A;
      color:#AFC1FF
    }
    html[data-theme="dark"] .badge.gold{
      background:#3A301E;
      color:#F3D68E
    }
    html[data-theme="dark"] .badge.success{
      background:#123A24;
      color:#74D79A
    }

    /* Hero */
    .hero{padding:44px 0 28px}
    .hero-shell{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:24px;
      align-items:stretch
    }
    .hero-card{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:34px;
      background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface) 90%,var(--primary-3)));
      box-shadow:var(--shadow-sm);
      padding:38px
    }
    .hero-card::before{
      content:"";
      position:absolute;
      width:320px;
      height:320px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(212,162,76,.16),transparent 68%);
      top:-110px;
      left:-80px
    }
    .eyebrow{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:7px 11px;
      border-radius:999px;
      background:var(--surface-2);
      border:1px solid var(--line);
      font-size:11px;
      font-weight:900;
      position:relative
    }
    .hero h1{
      font-size:clamp(36px,5vw,66px);
      line-height:1.05;
      margin:18px 0 16px;
      letter-spacing:-1px;
      position:relative
    }
    .hero h1 span{color:var(--primary)}
    .hero p{
      font-size:18px;
      color:var(--muted);
      max-width:730px;
      position:relative
    }
    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:24px;
      position:relative
    }
    .hero-note{
      margin-top:14px;
      font-size:12px;
      color:var(--muted);
      position:relative
    }
    .hero-side{
      border-radius:34px;
      background:linear-gradient(150deg,#0F7B5F,#0B5E4A);
      color:#fff;
      box-shadow:var(--shadow-lg);
      padding:24px;
      position:relative;
      overflow:hidden
    }
    .hero-side::after{
      content:"";
      position:absolute;
      width:280px;
      height:280px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.14);
      right:-70px;
      bottom:-70px;
      box-shadow:
        0 0 0 34px rgba(255,255,255,.04),
        0 0 0 70px rgba(255,255,255,.025)
    }
    .hero-side-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      position:relative;
      z-index:2
    }
    .hero-side h3{margin:0;font-size:22px}
    .hero-side p{
      margin:6px 0 0;
      color:#D5F0E8;
      font-size:13px
    }
    .hero-side-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      margin-top:20px;
      position:relative;
      z-index:2
    }
    .hero-mini{
      padding:14px;
      border-radius:18px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.12)
    }
    .hero-mini small{
      display:block;
      color:#C2DFD7;
      font-size:10px
    }
    .hero-mini strong{
      display:block;
      font-size:18px;
      margin-top:4px
    }

    /* AI prompt */
    .smart-search{
      margin-top:18px;
      display:flex;
      gap:10px;
      position:relative
    }
    .smart-search input{
      flex:1;
      min-width:0;
      padding:15px 16px;
      border-radius:17px;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      box-shadow:var(--shadow-xs)
    }
    .quick-row{
      display:flex;
      gap:8px;
      overflow:auto;
      padding:10px 0 2px
    }
    .chip{
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      padding:9px 12px;
      border-radius:999px;
      white-space:nowrap;
      font-size:12px;
      font-weight:800
    }
    .chip:hover,.chip.active{background:var(--surface-2)}

    /* Sections / cards */
    .section{padding:28px 0}
    .section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:16px
    }
    .section-title{
      display:flex;
      gap:10px;
      align-items:center
    }
    .section-title .mark{
      width:9px;
      height:32px;
      border-radius:9px;
      background:linear-gradient(180deg,var(--gold),var(--primary))
    }
    .section-title h2{
      font-size:24px;
      margin:0
    }

    .grid{
      display:grid;
      gap:16px
    }
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}

    .card{
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow-xs)
    }
    .card.pad{padding:20px}
    .card:hover{box-shadow:var(--shadow-sm)}

    .service-card{
      position:relative;
      overflow:hidden;
      min-height:180px;
      padding:20px;
      display:flex;
      flex-direction:column;
      justify-content:space-between
    }
    .service-card .service-icon{
      width:56px;
      height:56px;
      border-radius:18px;
      display:grid;
      place-items:center;
      background:var(--surface-2);
      font-size:27px
    }
    .service-card h3{
      margin:12px 0 5px;
      font-size:18px
    }
    .service-card p{
      margin:0;
      color:var(--muted);
      font-size:12px
    }
    .service-card::after{
      content:"";
      position:absolute;
      width:150px;
      height:150px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(15,123,95,.09),transparent 70%);
      left:-40px;
      bottom:-50px
    }

    .provider-card{
      padding:18px;
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:20px;
      box-shadow:var(--shadow-xs)
    }
    .provider-head{
      display:flex;
      gap:12px;
      align-items:center
    }
    .provider-avatar{
      width:54px;
      height:54px;
      border-radius:18px;
      background:linear-gradient(145deg,var(--primary-3),var(--surface-2));
      display:grid;
      place-items:center;
      font-weight:900;
      color:var(--primary)
    }
    .provider-card h3{
      margin:0;
      font-size:16px
    }
    .meta{
      color:var(--muted);
      font-size:11px
    }
    .provider-actions{
      display:flex;
      gap:8px;
      margin-top:14px
    }

    .product-card{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--surface);
      box-shadow:var(--shadow-xs)
    }
    .product-media{
      aspect-ratio:1/0.78;
      background:var(--surface-2);
      display:grid;
      place-items:center;
      font-size:54px
    }
    .product-body{padding:16px}
    .price{
      font-family:var(--font-en);
      font-weight:800
    }

    .split{
      display:grid;
      grid-template-columns:1fr .9fr;
      gap:18px
    }
    .info-list{display:grid;gap:10px}
    .info-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      background:var(--surface-2);
      border-radius:15px
    }

    /* Forms */
    .field{display:grid;gap:7px;margin-bottom:13px}
    .field label{
      font-size:12px;
      font-weight:900
    }
    .field input,
    .field select,
    .field textarea{
      width:100%;
      border:1px solid var(--line);
      background:var(--surface);
      color:var(--text);
      border-radius:14px;
      padding:12px 13px
    }
    .field textarea{
      min-height:110px;
      resize:vertical
    }

    /* AI */
    .ai-shell{
      max-width:900px;
      margin:0 auto
    }
    .ai-hero{
      border-radius:30px;
      padding:22px;
      color:#fff;
      background:
        radial-gradient(circle at 15% 15%,rgba(124,58,237,.35),transparent 32%),
        linear-gradient(135deg,#162B6B,#442B94);
      box-shadow:var(--shadow-lg)
    }
    .ai-avatar{
      width:64px;
      height:64px;
      border-radius:22px;
      background:#7ED957;
      color:#11380B;
      border:4px solid rgba(255,255,255,.35);
      display:grid;
      place-items:center;
      font-size:26px;
      font-weight:900;
      position:relative
    }
    .ai-avatar::before,
    .ai-avatar::after{
      content:"";
      position:absolute;
      top:-6px;
      width:11px;
      height:14px;
      background:#7ED957;
      border-radius:9px 9px 2px 2px
    }
    .ai-avatar::before{right:8px;transform:rotate(25deg)}
    .ai-avatar::after{left:8px;transform:rotate(-25deg)}
    .chat-box{
      margin-top:16px;
      min-height:400px;
      max-height:62vh;
      overflow:auto;
      padding:16px;
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:26px
    }
    .bubble{
      max-width:82%;
      padding:12px 14px;
      border-radius:17px;
      margin:8px 0;
      white-space:pre-wrap
    }
    .bubble.ai{
      background:var(--surface-2);
      margin-left:auto;
      border-bottom-right-radius:6px
    }
    .bubble.user{
      background:var(--primary);
      color:#fff;
      margin-right:auto;
      border-bottom-left-radius:6px
    }
    .chat-input{
      display:flex;
      gap:8px;
      margin-top:12px
    }
    .chat-input textarea{
      flex:1;
      min-height:55px;
      max-height:130px;
      border:1px solid var(--line);
      border-radius:17px;
      padding:12px 14px;
      background:var(--surface);
      color:var(--text)
    }

    /* Mascot */
    .ai-fab{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:120;
      width:70px;
      height:70px;
      border:0;
      border-radius:50%;
      background:linear-gradient(145deg,#7ED957,#55A83D);
      box-shadow:0 20px 45px rgba(56,132,48,.30);
      display:grid;
      place-items:center;
      animation:float 4s ease-in-out infinite
    }
    .ai-fab .eye{
      width:28px;
      height:28px;
      border-radius:50%;
      background:#fff;
      display:grid;
      place-items:center;
      position:relative
    }
    .ai-fab .eye::after{
      content:"";
      width:12px;
      height:12px;
      border-radius:50%;
      background:#111827
    }
    .ai-fab .horn{
      position:absolute;
      width:12px;
      height:17px;
      background:#7ED957;
      top:-7px;
      border-radius:9px 9px 2px 2px
    }
    .ai-fab .horn.left{left:14px;transform:rotate(-18deg)}
    .ai-fab .horn.right{right:14px;transform:rotate(18deg)}
    .ai-fab .mouth{
      position:absolute;
      bottom:17px;
      width:18px;
      height:8px;
      border-bottom:3px solid #174A0F;
      border-radius:0 0 50% 50%
    }
    @keyframes float{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-7px)}
    }

    /* Bottom Navigation */
    .bottom-nav{
      display:none;
      position:fixed;
      left:10px;
      right:10px;
      bottom:10px;
      z-index:100;
      background:color-mix(in srgb,var(--surface) 92%,transparent);
      backdrop-filter:blur(18px);
      border:1px solid var(--line);
      border-radius:22px;
      padding:7px;
      box-shadow:var(--shadow-lg)
    }
    .bottom-nav-inner{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:4px
    }
    .bottom-item{
      border:0;
      background:transparent;
      color:var(--muted);
      padding:9px 4px;
      border-radius:15px;
      display:grid;
      gap:3px;
      place-items:center;
      font-size:10px;
      font-weight:800
    }
    .bottom-item.active{
      background:var(--primary-3);
      color:var(--primary)
    }

    /* Modal */
    .modal{
      position:fixed;
      inset:0;
      z-index:200;
      background:rgba(5,12,17,.58);
      backdrop-filter:blur(8px);
      display:grid;
      place-items:center;
      padding:18px
    }
    .modal-panel{
      width:min(680px,100%);
      max-height:90vh;
      overflow:auto;
      background:var(--surface);
      color:var(--text);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow-lg);
      padding:20px
    }
    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px
    }

    /* Toast */
    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%) translateY(30px);
      z-index:250;
      background:#101828;
      color:#fff;
      padding:12px 16px;
      border-radius:14px;

  /* ============================================================

     ============================================================ */

  const DB_NAME = "balady-mazen-db";
  const DB_VERSION = 1;
  let dbPromise = null;

  function openDB(){
    if(dbPromise) return dbPromise;

    dbPromise = new Promise((resolve,reject)=>{
      if(!("indexedDB" in window)){
        resolve(null);
        return;
      }

      const req = indexedDB.open(DB_NAME,DB_VERSION);

      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains("state")){
          db.createObjectStore("state",{keyPath:"id"});
        }
      };

      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });

    return dbPromise;
  }

  async function loadState(){
    try{
      const db = await openDB();

      if(!db){
        const raw = localStorage.getItem("balady_state");
        if(raw) STATE = {...defaultState(),...JSON.parse(raw)};
        return;
      }

      const data = await new Promise((resolve,reject)=>{
        const tx = db.transaction("state","readonly");
        const req = tx.objectStore("state").get("app");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });

      if(data?.value){
        STATE = {...defaultState(),...data.value};
      }
    }catch(err){
      console.warn("State load failed",err);

      try{
        const raw = localStorage.getItem("balady_state");
        if(raw) STATE = {...defaultState(),...JSON.parse(raw)};
      }catch{}
    }
  }

  async function saveState(){
    try{
      const db = await openDB();

      if(!db){
        localStorage.setItem("balady_state",JSON.stringify(STATE));
        return;
      }

      await new Promise((resolve,reject)=>{
        const tx = db.transaction("state","readwrite");
        tx.objectStore("state").put({
          id:"app",
          value:STATE,
          updatedAt:new Date().toISOString()
        });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }catch(err){
      console.warn("State save failed",err);

      try{
        localStorage.setItem("balady_state",JSON.stringify(STATE));
      }catch{}
    }
  }

  function detectIntent(text){
    const t = String(text||"").toLowerCase();

    if(/طبيب|دكتور|عيادة|كشف|باطنة|أطفال|جلدية/.test(t))
      return {intent:"doctor",category:"doctors"};

    if(/مدرس|درس|تعليم|رياضيات|فيزياء|انجليزي|إنجليزي|مادة/.test(t))
      return {intent:"teacher",category:"teachers"};

    if(/توصيل|مشوار|مطار|وصلني|نقل/.test(t))
      return {intent:"delivery",category:"delivery"};

    if(/موبايل|هاتف|ايفون|آيفون|سامسونج|ريدمي|فون/.test(t))
      return {intent:"mobile",category:"mobile"};

    if(/سيارة|عربية|عربيات|تأجير|إيجار|شراء سيارة/.test(t))
      return {intent:"car",category:"cars"};

    if(/محامي|قانون|قضية|استشارة قانونية/.test(t))
      return {intent:"lawyer",category:"lawyers"};

    if(/صيدلية|دواء|دواء/.test(t))
      return {intent:"pharmacy",category:"pharmacy"};

    if(/صيانة|كهرباء|سباك|تكييف/.test(t))
      return {intent:"maintenance",category:"maintenance"};

    return {intent:"unknown",category:""};
  }

  function searchProviders(query){

        p.specialty,
        p.subject,
        p.location,
        ...(p.tags||[])
      ].join(" ").toLowerCase();

      return haystack.includes(q);
    });
  }

  function currentRoute(){
    const raw = location.hash.replace(/^#/,"") || "home";
    const parts = raw.split("/");
    return {
      page:parts[0] || "home",
      id:parts[1] || ""
    };
  }

  function navigate(page,id=""){
    location.hash = id ? `${page}/${encodeURIComponent(id)}` : page;
  }

  function renderRoute(){
    const {page,id} = currentRoute();
    const renderer = ROUTES[page] || renderHome;

    try{
      renderer(decodeURIComponent(id));
    }catch(err){
      console.error("Render error",err);
      renderHome();
      toast("حدث خطأ أثناء فتح الصفحة.");
    }

    updateNavigation(page);
    window.scrollTo({top:0,behavior:"smooth"});
    maybeCameo();
  }

  window.addEventListener("hashchange",renderRoute);

  function updateNavigation(page){
    $$(".nav-link,.bottom-item").forEach(el=>{

  async function sendAI(){

    STATE.messages.push({

  async function runAI(text){
    if(CONFIG.aiEndpoint){
      try{
        const response = await fetch(CONFIG.aiEndpoint,{
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          credentials:"include",
          body:JSON.stringify({
            message:text,
            locale:"ar-EG",
            sessionId:STATE.user.id
          })
        });

        if(response.ok){
          const data = await response.json();

          if(data?.reply){
            return String(data.reply);
          }
        }
      }catch(err){
        console.warn("AI endpoint unavailable",err);
      }
    }

    const detected = detectIntent(text);

    if(detected.intent==="doctor"){
      const matches = DOCTORS.filter(x=>{
        const q = text.toLowerCase();

        return [
          x.name,
          x.specialty,
          x.location,
          ...(x.tags||[])
        ].join(" ").toLowerCase().split(/\s+/)
          .some(word=>q.includes(word));
      });

      const list = (matches.length ? matches : DOCTORS).slice(0,3);

      return [

  function startVoice(inputId){
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){
      return toast("التعرف الصوتي غير مدعوم في هذا المتصفح.");
    }

    const target = $("#"+inputId);

    if(!target) return;

    const recognition = new SpeechRecognition();

    recognition.lang = "ar-EG";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => toast("اتكلم يا باشا...");
    recognition.onerror = () => toast("تعذر التقاط الصوت.");

    recognition.onresult = event=>{
      target.value = event.results?.[0]?.[0]?.transcript || "";
    };

    recognition.start();
  }

  function speak(text){
    if(!("speechSynthesis" in window)) return;

    try{
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ar-EG";
      utterance.rate = .95;
      utterance.pitch = 1.05;

      window.speechSynthesis.speak(utterance);
    }catch{}
  }

  async function registerServiceWorker(){
    if(!("serviceWorker" in navigator)) return;

    if(location.protocol!=="https:" &&
       location.hostname!=="localhost" &&
       location.hostname!=="127.0.0.1"){
      return;
    }

    try{
      const reg = await navigator.serviceWorker.register(
        "./sw.js",
        {scope:"./"}
      );

      navigator.serviceWorker.addEventListener(
        "controllerchange",
        ()=>{
          toast("تم تحديث تطبيق خدمات بلدي");
        }
      );

      reg.addEventListener(
        "updatefound",
        ()=>{
          const worker = reg.installing;

          if(!worker) return;

          worker.addEventListener(
            "statechange",
            ()=>{
              if(
                worker.state==="installed" &&
                navigator.serviceWorker.controller
              ){
                toast(
                  "تحديث جديد جاهز — أعد فتح التطبيق."
                );
              }
            }
          );
        }
      );
    }catch(err){
      console.warn(
        "[PWA] Service Worker registration failed",
        err
      );
    }
  }

        break;

        startVoice(el.dataset.input);

          delivery:"توصيل"
        };

        if(map[q]){

          if(input){
            input.value = map[q];
          }

          const results = $("#exploreResults");

          if(results){
            results.innerHTML = exploreResults(map[q]);
          }
        }else{
          const input = $("#exploreSearch");

          if(input){
            input.value = "";
          }

          const results = $("#exploreResults");

          if(results){
            results.innerHTML = exploreResults("");
          }
        }

        break;
      }

      case "run-explore-search":{
        const q = $("#exploreSearch")?.value || "";
        const results = $("#exploreResults");

        if(results){
          results.innerHTML = exploreResults(q);
        }

        break;
      }

      case "slot":
        $$(".slot").forEach(x=>{
          x.classList.remove("active");
        });

        el.classList.add("active");
        selectedSlot = el.dataset.slot;

        break;

      case "book":
        openBooking(
          el.dataset.type,
          el.dataset.id
        );
        break;

      case "call":
        callNumber(el.dataset.phone);
        break;

      case "favorite":
        await favorite(el.dataset.id);
        break;

      case "buy-product":
        buyProduct(el.dataset.id);
        break;

      case "car-order":
        orderCar(el.dataset.id);
        break;

      case "confirm-order":{
        try{
          const data = JSON.parse(
            el.dataset.payload || "{}"
          );

          await commitOrder(data);
        }catch(err){
          console.error(err);
          toast("تعذر إنشاء الطلب.");
        }

        break;
      }

      case "plans":
        openPlans();
        break;

      case "subscribe":
        await subscribePlan(
          el.dataset.plan,
          Number(el.dataset.price)
        );
        break;

      case "owner":
        navigate("owner");
        break;

      case "owner-login":
        await ownerLogin();
        break;

      case "download-invoice":
        downloadInvoice(el.dataset.id);
        break;

      case "share-invoice":
        await shareInvoice(el.dataset.id);
        break;

      case "reorder":
        reorder(el.dataset.id);
        break;

      case "mark-notifications":
        await markNotifications();
        break;

      case "clear-local":
        clearLocal();
        break;

        await confirmClearLocal();
        break;

      case "install":
        await installApp();
        break;

      case "hide-install":
        $("#installBanner")?.classList.add("hidden");
        break;

      case "toast":
        toast(el.dataset.text || "تم");
        break;

          .replace(/\D/g,"");

        !/^01\d{9}$/.test(phone)
      ){

      }

      STATE.user.name = name;
      STATE.user.phone = phone;

      await saveState();

      toast("تم حفظ البيانات محليًا");

      renderRoute();

      return;
    }

    if(form.id==="providerForm"){
      e.preventDefault();

      STATE.providerDraft = {
        name:$("#prName")?.value.trim() || "",
        phone:$("#prPhone")?.value.trim() || "",
        address:$("#prAddress")?.value.trim() || "",
        maps:$("#prMaps")?.value.trim() || "",
        site:$("#prSite")?.value.trim() || "",
        description:$("#prDesc")?.value.trim() || ""
      };

      await saveState();

      toast(
        "تم حفظ مسودة مقدم الخدمة محليًا."
      );

      return;
    }
  });

  document.addEventListener("keydown",e=>{
    const el = e.target;

    if(
      e.key==="Enter" &&
      el?.id==="aiInput"
    ){
      e.preventDefault();
      sendAI();
    }

    if(
      e.key==="Enter" &&
      el?.id==="messageInput"
    ){
      e.preventDefault();
      sendMessage();
    }

    if(
      (e.key==="Enter" || e.key===" ") &&
      el?.id==="aiFab"
    ){
      e.preventDefault();
      navigate("ai");
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */

  (async function boot(){

    await loadState();

    applyTheme();

    setupInstall();

    renderRoute();

    await registerServiceWorker();

  })();

  </script>
</body>
  </html>
