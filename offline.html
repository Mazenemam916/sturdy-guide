<!doctype html>
<html
  lang="ar"
  dir="rtl"
>
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0F7B5F"
  >

  <meta
    name="description"
    content="خدمات بلدي | Mazen AI — وضع عدم الاتصال"
  >

  <title>
    خدمات بلدي | غير متصل
  </title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;

      background:
        radial-gradient(
          circle at top right,
          rgba(15,123,95,.10),
          transparent 35%
        ),
        #F7FAF8;

      color:#101828;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card{
      width:min(
        560px,
        100%
      );

      padding:34px;

      text-align:center;

      background:#fff;

      border:1px solid #E3E9E6;

      border-radius:28px;

      box-shadow:
        0 30px 80px
        rgba(15,23,42,.10);
    }

    .icon{
      width:80px;
      height:80px;

      margin:
        0 auto 18px;

      display:grid;
      place-items:center;

      border-radius:24px;

      background:#DDF7EE;

      font-size:42px;
    }

    h1{
      margin:0 0 10px;

      font-size:
        clamp(25px,6vw,36px);
    }

    p{
      margin:0;

      color:#667085;

      line-height:1.9;

      font-size:15px;
    }

    .actions{
      margin-top:22px;

      display:flex;

      justify-content:center;

      gap:10px;

      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;

      align-items:center;

      justify-content:center;

      padding:
        12px 18px;

      min-height:48px;

      background:#0F7B5F;

      color:#fff;

      text-decoration:none;

      border-radius:14px;

      font-weight:800;
    }

    .btn.secondary{
      background:#F1F5F3;

      color:#101828;
    }

    .hint{
      margin-top:18px;

      font-size:11px;

      color:#98A2B3;
    }

    @media(
      prefers-color-scheme:dark
    ){

      body{
        background:#071019;
        color:#F8FAFC;
      }

      .card{
        background:#0D1822;
        border-color:#233442;

        box-shadow:
          0 40px 110px
          rgba(0,0,0,.35);
      }

      .icon{
        background:#0F332A;
      }

      p{
        color:#9BA9B7;
      }

      .btn.secondary{
        background:#13202C;
        color:#F8FAFC;
      }

      .hint{
        color:#667085;
      }
    }

  </style>

</head>

<body>

  <main
    class="card"
    aria-labelledby="offlineTitle"
  >

    <div
      class="icon"
      aria-hidden="true"
    >
      📡
    </div>

    <h1 id="offlineTitle">
      أنت غير متصل بالإنترنت
    </h1>

    <p>
      بعض أجزاء خدمات بلدي تم تخزينها
      على جهازك ويمكن أن تعمل دون اتصال.
      عند عودة الإنترنت يمكنك تحديث الصفحة
      للحصول على أحدث البيانات والخدمات.
    </p>

    <div class="actions">

      <a
        class="btn"
        href="./index.html#home"
      >
        العودة للمنصة
      </a>

      <button
        class="btn secondary"
        type="button"
        onclick="location.reload()"
      >
        إعادة المحاولة
      </button>

    </div>

    <div class="hint">
      خدمات بلدي | Mazen AI · Offline Mode
    </div>

  </main>

</body>
  </html>
