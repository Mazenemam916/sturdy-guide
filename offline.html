<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غير متصل — خدمات بلدي</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;
  font-family:system-ui,sans-serif;background:#F8FAF8;color:#0F172A;
  text-align:center;padding:24px}
.box{max-width:480px;padding:32px;background:#fff;border:1px solid #E6EAE8;
  border-radius:24px;box-shadow:0 10px 32px rgba(15,23,42,.08)}
.icon{font-size:64px;margin-bottom:8px}
h1{margin:0 0 8px;color:#0F7B5F}
p{color:#667085;margin:0 0 20px;line-height:1.7}
button{padding:12px 22px;border:0;border-radius:14px;
  background:linear-gradient(135deg,#0F7B5F,#18A97E);color:#fff;
  font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🛰️</div>
  <h1>أنت غير متصل بالإنترنت</h1>
  <p>بياناتك محفوظة على جهازك.<br>جرّب إعادة الاتصال ثم أعد التحميل.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</div>
</body>
</html>
